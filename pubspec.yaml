name: taqfeel_alyawmi
description: "A fully offline local mobile application for stock tracking and daily closing"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization & Formatting
  intl: ^0.19.0

  # Offline Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # File Management & Export
  path_provider: ^2.1.2
  csv: ^6.0.0

  # Offline ML & AI Modules
  google_mlkit_text_recognition: ^0.13.0
  tflite_flutter: ^0.10.4
  speech_to_text: ^6.6.0
  image: ^4.1.3 # Helper for image resizing before passing to tflite

  # State Management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Asset definitions for models and local translations
  assets:
    - assets/model.tflite
    - assets/labels.txt
